<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Hatsune Miku in 3D Rhythm Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Arial', sans-serif; }
        
        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            z-index: 1; 
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; 
        }
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; 
            z-index: 3; 
        }
        
        #start-ui { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100%; position: relative; 
            background-image: url('./start_screen.jpg'); 
            background-size: cover; background-position: center;
            pointer-events: auto;
        }
        
        .title-logo {
            position: absolute; top: 50px; right: 50px;
            font-size: 48px; font-weight: bold; color: #87CEEB; 
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }

        .btn { 
            pointer-events: auto; padding: 15px 50px; font-size: 28px; font-weight: bold; 
            color: white; background-color: #39C5BB; 
            border: 3px solid white; border-radius: 40px; cursor: pointer; transition: 0.3s; 
            position: absolute; bottom: 100px;
        }
        .btn:hover { background-color: #ffffff; color: #39C5BB; }

        #select-ui { 
            display: none; flex-direction: column; align-items: center; justify-content: flex-start; 
            height: 100%; padding-top: 100px;
            background-image: url('./select_screen.jpg'); 
            background-size: cover; background-position: center;
            pointer-events: auto;
        }

        #ingame-ui { display: none; padding: 20px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); width: 100%; height: 100%; box-sizing: border-box; position: relative; }
        
        .top-bar { display: flex; justify-content: space-between; font-size: 28px; font-weight: bold; }
        .score-box span { color: #39C5BB; font-size: 40px; }
        .hp-bar { width: 300px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid white; }
        .hp-fill { width: 100%; height: 100%; background: #39C5BB; transition: width 0.2s; }
        
        #ingame-back-btn { position: absolute; bottom: 30px; left: 30px; font-size: 18px; padding: 10px 20px; background-color: #ff4444; border-color: #ffffff; pointer-events: auto; }
        
        #judge-text { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; font-weight: bold; text-align: center; transition: transform 0.1s; }
        
        #combo-container { position: absolute; top: 50%; right: 10%; transform: translateY(-50%); text-align: center; display: none; }
        .triangle-bg { width: 0; height: 0; border-left: 80px solid transparent; border-right: 80px solid transparent; border-top: 120px solid rgba(255, 255, 255, 0.2); position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: -1; }
        #combo-title { font-size: 20px; font-weight: bold; color: white; margin-bottom: 5px; }
        #combo-display { font-size: 45px; color: #39C5BB; font-weight: bold; }

        #result-ui { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10;}
        #result-status { font-size: 70px; font-weight: bold; margin-bottom: 10px; }
        #result-max-combo { font-size: 35px; color: #39C5BB; margin-bottom: 30px; font-weight: bold; }
        
        #result-detailed-stats { 
            font-size: 24px; color: white; margin-bottom: 40px; text-align: left; 
            line-height: 1.8; width: 250px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-line { display: flex; justify-content: space-between; font-weight: bold; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <video id="bg-video" playsinline style="display:none;">
        <source src="./HoYoHoYoにしてあげる♪.mp4" type="video/mp4">
    </video>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="start-ui">
            <div class="title-logo">Hatsune Miku in 3D Rhythm Game</div>
            <button id="start-btn" class="btn">START</button>
        </div>

        <div id="select-ui">
            <button id="song-hoyohoyo" class="btn" style="position: relative; bottom: auto;">♪ HoYoHoYoにしてあげる♪</button>
        </div>

        <div id="ingame-ui">
            <div class="top-bar">
                <div class="score-box">SCORE <br><span id="score-display">000000</span></div>
                <div class="hp-box">HP <div class="hp-bar"><div id="hp-fill" class="hp-fill"></div></div></div>
            </div>
            <div id="judge-text"></div>
            <div id="combo-container">
                <div class="triangle-bg"></div>
                <div id="combo-title">COMBO</div>
                <div id="combo-display"></div>
            </div>
            <button id="ingame-back-btn" class="btn">Back</button>
        </div>

        <div id="result-ui">
            <div id="result-status"></div>
            <div id="result-max-combo"></div>
            <div id="result-detailed-stats">
                <div class="stat-line" style="color: #ff4444;">PERFECT <span id="res-perfect">0</span></div>
                <div class="stat-line" style="color: #ffaa00;">GREAT <span id="res-great">0</span></div>
                <div class="stat-line" style="color: #ffff00;">GOOD <span id="res-good">0</span></div>
                <div class="stat-line" style="color: #aaaaaa;">BAD <span id="res-bad">0</span></div>
                <div class="stat-line" style="color: #ff0000;">MISS <span id="res-miss">0</span></div>
            </div>
            <button id="result-back-btn" class="btn" style="position: relative; bottom: auto;">Go to Song Select</button>
        </div>
    </div>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
