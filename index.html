<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>AKARHYTHM</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Arial', sans-serif; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* 시작 화면 UI */
        #start-ui { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 80%; }
        .btn { pointer-events: auto; padding: 15px 40px; font-size: 24px; font-weight: bold; color: white; background-color: #000080; border: 2px solid white; border-radius: 30px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #ffffff; color: #000080; }

        /* 노래 선택 화면 */
        #song-select { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; }

        /* 인게임 UI */
        #ingame-ui { display: none; padding: 20px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); width: 100%; height: 100%; box-sizing: border-box; position: relative; }
        .top-bar { display: flex; justify-content: space-between; font-size: 28px; font-weight: bold; }
        .score-box span { color: #ff4444; font-size: 40px; }
        .hp-bar { width: 300px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid white; }
        .hp-fill { width: 100%; height: 100%; background: #4444ff; transition: width 0.2s; }
        
        /* 인게임 뒤로가기 버튼 */
        #ingame-back-btn { position: absolute; bottom: 30px; left: 30px; font-size: 18px; padding: 10px 20px; background-color: #ff4444; border-color: #ffffff; }
        #ingame-back-btn:hover { background-color: #ffffff; color: #ff4444; }

        /* 판정 텍스트 (중앙) */
        #judge-text { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; font-weight: bold; text-align: center; transition: transform 0.1s; }
        
        /* 콤보 UI (우측 중앙) */
        #combo-container { position: absolute; top: 50%; right: 10%; transform: translateY(-50%); text-align: center; display: none; }
        .triangle-bg { width: 0; height: 0; border-left: 80px solid transparent; border-right: 80px solid transparent; border-top: 120px solid rgba(255, 255, 255, 0.2); position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: -1; }
        #combo-title { font-size: 20px; font-weight: bold; color: white; margin-bottom: 5px; }
        #combo-display { font-size: 45px; color: #00ffff; font-weight: bold; }

        /* 결과창 UI */
        #result-ui { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
        #result-status { font-size: 80px; font-weight: bold; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(255,255,255,0.3); }
        #result-max-combo { font-size: 40px; color: #00ffff; margin-bottom: 50px; font-weight: bold; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="start-ui">
            <button id="start-btn" class="btn">START</button>
        </div>

        <div id="song-select">
            <button id="song-yonsei" class="btn">♪ 연세여 사랑한다</button>
        </div>

        <div id="ingame-ui">
            <div class="top-bar">
                <div class="score-box">SCORE <br><span id="score-display">000000</span></div>
                <div class="hp-box">HP <div class="hp-bar"><div id="hp-fill" class="hp-fill"></div></div></div>
            </div>
            <div id="judge-text"></div>
            <div id="combo-container">
                <div class="triangle-bg"></div>
                <div id="combo-title">COMBO</div>
                <div id="combo-display"></div>
            </div>
            <button id="ingame-back-btn" class="btn">뒤로 가기</button>
        </div>

        <div id="result-ui">
            <div id="result-status"></div>
            <div id="result-max-combo"></div>
            <button id="result-back-btn" class="btn">노래 선택창으로</button>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
